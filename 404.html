<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 页面未找到 | 陈俊良作品集</title>
    <meta name="description" content="页面未找到，返回陈俊良个人作品集首页">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Noto Serif SC', 'Microsoft YaHei', '微软雅黑', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .bg-grain {
            position: fixed;
            inset: 0;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
        }
        .bg-orb-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(180,140,80,0.04) 0%, transparent 70%);
            top: -10%; left: 60%;
        }
        .bg-orb-2 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(100,140,180,0.03) 0%, transparent 70%);
            bottom: -10%; left: 20%;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .error-code {
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
            font-size: clamp(8rem, 20vw, 16rem);
            line-height: 1;
            color: rgba(255,255,255,0.06);
            position: relative;
            user-select: none;
        }
        .error-code-glitch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
            font-size: clamp(8rem, 20vw, 16rem);
            line-height: 1;
            color: rgba(220,38,38,0.3);
            animation: glitch 3s infinite;
            pointer-events: none;
            user-select: none;
        }
        @keyframes glitch {
            0%, 90%, 100% { opacity: 0; transform: translateX(-50%) translate(0, 0); }
            92% { opacity: 0.8; transform: translateX(-50%) translate(-3px, 2px); }
            94% { opacity: 0.6; transform: translateX(-50%) translate(3px, -1px); }
            96% { opacity: 0.9; transform: translateX(-50%) translate(-2px, -2px); }
            98% { opacity: 0.4; transform: translateX(-50%) translate(2px, 1px); }
        }
        .error-title {
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.2em;
            margin-top: -20px;
            margin-bottom: 16px;
        }
        .error-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.08em;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 36px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
            font-size: 1rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .back-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.03);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .back-btn:hover::before {
            transform: translateX(0);
        }
        .back-btn:hover {
            border-color: rgba(255,255,255,0.4);
            color: rgba(255,255,255,0.9);
        }
        .countdown {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
            margin-top: 24px;
        }
        .countdown span {
            color: rgba(180,140,80,0.5);
        }
        .corner {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 0;
        }
        .corner-tl { top: 5vh; left: 5vw; border-top: 1px solid rgba(255,255,255,0.08); border-left: 1px solid rgba(255,255,255,0.08); }
        .corner-tr { top: 5vh; right: 5vw; border-top: 1px solid rgba(255,255,255,0.08); border-right: 1px solid rgba(255,255,255,0.08); }
        .corner-bl { bottom: 5vh; left: 5vw; border-bottom: 1px solid rgba(255,255,255,0.08); border-left: 1px solid rgba(255,255,255,0.08); }
        .corner-br { bottom: 5vh; right: 5vw; border-bottom: 1px solid rgba(255,255,255,0.08); border-right: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <div class="bg-grain"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="container">
        <div class="error-code">404</div>
        <div class="error-code-glitch" aria-hidden="true">404</div>
        <div class="error-title">页面未找到</div>
        <div class="error-desc">
            您访问的页面不存在或已被移除<br>
            或许它只是暂时去向了另一个维度
        </div>
        <a href="index.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回首页
        </a>
        <div class="countdown"><span id="countdown-num">5</span> 秒后自动返回首页</div>
    </div>

    <script>
        (function() {
            var countdownEl = document.getElementById('countdown-num');
            var seconds = 5;
            var interval = setInterval(function() {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = 'index.html';
                } else {
                    countdownEl.textContent = seconds;
                }
            }, 1000);
        })();
    </script>
</body>
</html>
