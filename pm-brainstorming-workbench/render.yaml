services:
  - type: web
    name: pm-brainstorm-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/build_knowledge_base.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o
      - key: SESSION_DATA_DIR
        value: /opt/render/project/src/data/sessions
      - key: USER_DATA_DIR
        value: /opt/render/project/src/data/users
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
