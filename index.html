<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈俊良 | 个人作品集</title>
    <meta name="description" content="陈俊良的个人作品集，展示AI纪录片、AI广告片、游戏视频和实拍纪录片作品">
    <meta name="keywords" content="陈俊良,作品集,AI视频,纪录片,广告片">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="script.js" as="script">
</head>
<body>
    <div id="layer-landing" class="page-layer active">
        <div class="landing-bg"></div>
        <div class="landing-grain"></div>
        <div class="landing-overlay"></div>
        <div class="landing-content">
            <div class="landing-corner landing-corner-tl"></div>
            <div class="landing-corner landing-corner-tr"></div>
            <div class="landing-corner landing-corner-bl"></div>
            <div class="landing-corner landing-corner-br"></div>
            <div class="landing-orb landing-orb-1"></div>
            <div class="landing-orb landing-orb-2"></div>
            <div class="landing-orb landing-orb-3"></div>
            <div class="landing-top-left">
                <div class="landing-name-vertical">
                    <span>陈</span><span>俊</span><span>良</span>
                </div>
                <div class="landing-name-en">
                    <div class="landing-name-en-main">CHEN JUNLIANG</div>
                    <div class="landing-name-en-divider"></div>
                    <div class="landing-name-en-sub">AI Creator · Visual Storyteller</div>
                    <div class="landing-name-en-detail">纪录片 / 广告片 / 游戏视频 / 实拍影像</div>
                    <div class="landing-name-en-detail">以AI为笔，以光影为墨</div>
                    <div class="landing-name-en-detail">Weaving light and shadow with algorithms</div>
                </div>
            </div>
            <div class="landing-center">
                <div class="landing-enter-line landing-enter-line-top"></div>
                <button class="landing-enter" id="enter-portfolio">
                    <span class="landing-enter-text">进入作品集</span>
                    <span class="landing-enter-text-en">ENTER PORTFOLIO</span>
                </button>
                <div class="landing-enter-line landing-enter-line-bottom"></div>
            </div>
            <div class="landing-year">MMXXIV</div>
            <div class="landing-bottom-text">DIRECTED BY CHEN JUNLIANG</div>
            <div class="landing-right-line"></div>
        </div>
    </div>

    <div id="layer-hub" class="page-layer">
        <div class="hub-bg"></div>
        <div class="hub-overlay"></div>
        <div class="hub-vignette"></div>
        <div class="hub-particles">
            <div class="hub-particle" style="left:10%;top:20%;width:2px;height:2px;opacity:0.2;--dur:8s;--delay:0s;"></div>
            <div class="hub-particle" style="left:25%;top:60%;width:1px;height:1px;opacity:0.15;--dur:12s;--delay:2s;"></div>
            <div class="hub-particle" style="left:45%;top:35%;width:3px;height:3px;opacity:0.1;--dur:10s;--delay:4s;"></div>
            <div class="hub-particle" style="left:65%;top:75%;width:2px;height:2px;opacity:0.25;--dur:7s;--delay:1s;"></div>
            <div class="hub-particle" style="left:80%;top:15%;width:1px;height:1px;opacity:0.3;--dur:15s;--delay:3s;"></div>
            <div class="hub-particle" style="left:35%;top:85%;width:2px;height:2px;opacity:0.18;--dur:9s;--delay:5s;"></div>
            <div class="hub-particle" style="left:55%;top:50%;width:1px;height:1px;opacity:0.35;--dur:6s;--delay:0.5s;"></div>
            <div class="hub-particle" style="left:90%;top:45%;width:2px;height:2px;opacity:0.12;--dur:13s;--delay:6s;"></div>
        </div>
        <div class="hub-content">
            <div class="hub-categories">
                <a class="hub-category" data-category="documentary" href="#">
                    <span class="hub-cat-text"><span class="cat-ai">AI</span>纪录片</span>
                    <span class="hub-cat-line"></span>
                </a>
                <a class="hub-category" data-category="ads" href="#">
                    <span class="hub-cat-text"><span class="cat-ai">AI</span>广告片</span>
                    <span class="hub-cat-line"></span>
                </a>
                <a class="hub-category" data-category="game" href="#">
                    <span class="hub-cat-text">长<span class="cat-ai">AI</span>游戏视频</span>
                    <span class="hub-cat-line"></span>
                </a>
                <a class="hub-category" data-category="real" href="#">
                    <span class="hub-cat-text">实拍纪录片</span>
                    <span class="hub-cat-line"></span>
                </a>
            </div>
            <div class="hub-title-vertical" id="hub-title">
                <span class="hub-title-char" data-char="作">作</span>
                <span class="hub-title-char" data-char="品">品</span>
                <span class="hub-title-char" data-char="集">集</span>
            </div>
        </div>
        <button class="hub-back" id="hub-back" aria-label="返回首页">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
    </div>

    <div id="layer-player" class="page-layer">
        <div class="player-bg"></div>
        <div class="player-content">
            <div class="player-header">
                <span class="player-category-label" id="player-cat-label"></span>
                <h2 class="player-video-title" id="player-title"></h2>
            </div>
            <div class="player-main">
                <div class="player-video-wrapper" id="player-video-wrapper">
                    <video id="player-video" preload="none" playsinline></video>
                    <div class="poster-curtain poster-curtain-left" id="poster-curtain-left"></div>
                    <div class="poster-curtain poster-curtain-right" id="poster-curtain-right"></div>
                    <div class="poster-curtain-seam" id="poster-curtain-seam"></div>
                    <button class="curtain-trigger" id="curtain-trigger" aria-label="拉开序幕">
                        <div class="curtain-trigger-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" opacity="0.5"><polygon points="8,5 20,12 8,19"/></svg>
                        </div>
                        <span class="curtain-trigger-text">拉开序幕</span>
                    </button>
                    <div class="player-loading" id="player-loading">
                        <div class="player-loading-spinner"></div>
                    </div>
                </div>
                <div class="player-nav">
                    <button class="player-nav-btn" id="btn-prev" aria-label="上一条视频">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                        <span>上一条</span>
                    </button>
                    <button class="player-nav-btn" id="btn-next" aria-label="下一条视频">
                        <span>下一条</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                    <button class="player-nav-btn player-nav-back" id="btn-back-hub" aria-label="返回作品集">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
                        <span>返回作品集</span>
                    </button>
                </div>
            </div>
            <div class="player-info" id="player-info">
            </div>
            <div class="player-controls" id="player-controls">
                <button class="ctrl-btn" id="ctrl-speed" aria-label="播放速度">1x</button>
                <button class="ctrl-btn" id="ctrl-pip" aria-label="画中画">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="9" width="8" height="6" rx="1" fill="currentColor" opacity="0.3"/></svg>
                </button>
                <div class="ctrl-progress" id="ctrl-progress">
                    <div class="ctrl-progress-bar" id="ctrl-progress-bar"></div>
                </div>
                <span class="ctrl-time" id="ctrl-time">0:00 / 0:00</span>
            </div>
        </div>
    </div>

    <div class="curtain-transition" id="curtain-transition">
        <div class="curtain-panel" id="curtain-panel"></div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
